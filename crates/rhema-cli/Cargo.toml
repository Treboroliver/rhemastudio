[package]
name = "rhema-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rhema-core = { workspace = true }
rhema-library = { path = "../rhema-library" }
rhema-refs = { path = "../rhema-refs" }
rhema-twformat = { path = "../rhema-twformat" }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.33", features = ["bundled"] }
encoding_rs = "0.8"
serde_json = { workspace = true }
anyhow = { workspace = true }
regex = "1"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
